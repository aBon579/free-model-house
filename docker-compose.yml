services:
  fmh:
    image: ghcr.io/abon579/free-model-house:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: free-model-house
    restart: unless-stopped
    ports:
      - "8678:8678"
    volumes:
      - ./data:/data
    environment:
      FMH_ADDR: "${FMH_ADDR:-:8678}"
      FMH_DATA: "${FMH_DATA:-/data}"
      FMH_SECRET_KEY: "${FMH_SECRET_KEY:-}"
      FMH_HIDE_KEYS: "${FMH_HIDE_KEYS:-0}"
      TZ: "${TZ:-Asia/Shanghai}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
