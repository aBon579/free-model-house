name: Release

# 打 tag（v0.1.0）→ 构建 amd64 + arm64 镜像推到 GHCR，并创建 GitHub Release。
# ⚠️ 手动触发只构建镜像，不创建 Release（没有 tag 就没有版本号）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release 需要
      packages: write # 推 GHCR 需要
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ⚠️ **git tag ≠ GitHub Release** ——
      #   只推 tag 的话 /releases 页面是空的。
      #   这一步才真正创建带说明的 Release 对象。
      #
      # ⚠️ **已存在就更新** —— 否则重推 tag 会因为 "release already exists" 失败。
      - name: 创建 / 更新 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Free Model House $GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE" --notes-file .github/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$TITLE" --notes-file .github/release-notes.md
          fi
